# CPU (default) + optional CUDA / MLX flavors. CUDA needs a toolkit runner;
# MLX needs MLX_ROOT on the macOS runner. First publish is CPU/Metal.
name: Publish OCI Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "OCI tag (empty → .asd :version)"
        required: false
        default: ""
      flavor:
        description: "cpu (default matrix) | cuda | mlx"
        required: false
        default: "cpu"
        type: string
      registry:
        description: "OCI registry"
        required: false
        default: "ghcr.io"

env:
  PACKAGE_VERSION_DEFAULT: "0.1.0"
  SBCL_VERSION: 2.6.7
  ROSWELL_VERSION: "26.02.116"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            flavor: cpu
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            flavor: cpu
          - os: darwin
            arch: arm64
            runner: macos-latest
            flavor: cpu
    runs-on: ${{ matrix.runner }}
    if: ${{ inputs.flavor == 'cpu' || inputs.flavor == '' || github.event_name == 'push' }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - uses: egao1980/cl-repository/.github/actions/setup-client@main
      - name: Install build deps (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git curl ninja-build
      - name: Install build deps (macOS)
        if: matrix.os == 'darwin'
        run: brew install cmake ninja || true
      - name: Build libvllm
        env:
          VLLM_CPP_FLAVOR: ${{ matrix.flavor }}
        run: |
          chmod +x scripts/build-vllm.sh
          ./scripts/build-vllm.sh
          mkdir -p native-bundle
          cp -a "lib/${{ matrix.os }}-${{ matrix.arch }}/." native-bundle/
      - uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: native-bundle/

  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          [ -z "$V" ] && V="${PACKAGE_VERSION_DEFAULT}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

  publish:
    needs: [build, resolve-version]
    permissions:
      contents: read
      packages: write
    uses: egao1980/cl-repository/.github/workflows/publish-native-package.yml@main
    with:
      package-name: vllm-cpp
      version: ${{ needs.resolve-version.outputs.version }}
      registry: ${{ inputs.registry || 'ghcr.io' }}
      packager-tag: "0.16.0"
      source-paths: |
        vllm-cpp.asd
        src
        include
        LICENSE
        NOTICE
        README.md
    secrets: inherit
